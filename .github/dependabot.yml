# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Low-risk npm updates (dev dependencies): weekly and grouped
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    allow:
      - dependency-type: "direct:development"
    groups:
      dev-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - "dependencies"
      - "bot"
      - "automerge-candidate"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Higher-risk npm updates (runtime dependencies): manual review
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
      - dependency-type: "direct:production"
    labels:
      - "dependencies"
      - "bot"
      - "manual-review"
    commit-message:
      prefix: "chore"
      include: "scope"
    
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "bot"
      - "github-actions"
      - "automerge-candidate"
    commit-message:
      prefix: "chore"
      include: "scope"