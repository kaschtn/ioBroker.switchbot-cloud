name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      - main
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}

    runs-on: ubuntu-22.04

    steps:
      - uses: ioBroker/testing-action-check@v1
        with:
          node-version: '20.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          lint: true

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [20.x, 22.x]
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'

  # Deploys the final package to NPM
  deploy:
    needs: [check-and-lint, adapter-tests]

    # Trigger this step only when a tagged release is pushed
    if: |
      !contains(github.event.head_commit.message || '', '[skip ci]') &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-22.04

    # Permissions required for NPM Trusted Publishing and GitHub releases
    permissions:
      contents: write      # Required to create GitHub releases
      id-token: write      # Required for NPM provenance via OIDC

    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then
            echo "::error::Expected a version tag like v1.2.3, got '$TAG'"
            exit 1
          fi

          VERSION="${TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          IO_PACKAGE_VERSION=$(node -p "require('./io-package.json').common.version")

          echo "Tag version: $VERSION"
          echo "package.json version: $PACKAGE_VERSION"
          echo "io-package.json version: $IO_PACKAGE_VERSION"

          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag version '$VERSION' does not match package.json version '$PACKAGE_VERSION'"
            exit 1
          fi

          if [[ "$VERSION" != "$IO_PACKAGE_VERSION" ]]; then
            echo "::error::Tag version '$VERSION' does not match io-package.json common.version '$IO_PACKAGE_VERSION'"
            exit 1
          fi

      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '20.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          # Trusted Publisher / OIDC setup is enabled in npm for this repo.
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # When using Sentry for error reporting, Sentry can be informed about new releases
          # To enable create a API-Token in Sentry (User settings, API keys)
          # Enter this token as a GitHub secret (with name SENTRY_AUTH_TOKEN) in the repository options
          # Then uncomment and customize the following block:
          # sentry: true
          # sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # sentry-project: "iobroker-switchbot-cloud"
          # sentry-version-prefix: "iobroker.switchbot-cloud"